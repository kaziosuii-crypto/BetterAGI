<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LAPLACE Relay · 实时观测</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-elev: #121722;
    --bg-elev2: #171d2b;
    --line: #222b3d;
    --line-soft: #1a2232;
    --text: #e6ebf5;
    --text-dim: #8a94ab;
    --text-faint: #5a6478;
    --accent: #5eead4;
    --accent-2: #818cf8;
    --chat: #60a5fa;
    --money: #f5c542;
    --audience: #34d399;
    --room: #a78bfa;
    --lifecycle: #f472b6;
    --moderation: #fb7185;
    --system: #94a3b8;
    --danger: #f87171;
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 15% -10%, #16213a 0%, transparent 60%),
                radial-gradient(900px 500px at 95% 0%, #1b1630 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; height: 100vh; }
  header.bar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(23,29,43,.92), rgba(18,23,34,.92));
    border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(8px);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; }
  .logo .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px rgba(94,234,212,.14), 0 0 18px rgba(94,234,212,.7);
  }
  .logo small { color: var(--text-faint); font-weight: 400; font-family: var(--mono); }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); color: var(--text-dim); background: var(--bg-elev);
    font-family: var(--mono);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .pill.on .dot { background: var(--audience); box-shadow: 0 0 10px rgba(52,211,153,.8); animation: breathe 2.4s ease-in-out infinite; }
  .pill.off .dot { background: var(--danger); }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  .main { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi {
    position: relative; overflow: hidden;
    padding: 14px 16px; border-radius: var(--radius);
    background: linear-gradient(160deg, var(--bg-elev2), var(--bg-elev));
    border: 1px solid var(--line);
  }
  .kpi::after {
    content: ""; position: absolute; inset: auto -30% -60% auto; width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(94,234,212,.10), transparent 65%);
  }
  .kpi .label { color: var(--text-dim); font-size: 12px; letter-spacing: .4px; }
  .kpi .value { font: 600 26px/1.2 var(--mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--text-faint); font-size: 11px; font-family: var(--mono); margin-top: 2px; }
  .kpi.hot .value { color: var(--money); }

  .feed-wrap {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(18,23,34,.85), rgba(11,14,20,.65));
    overflow: hidden;
  }
  .feed-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-bottom: 1px solid var(--line-soft);
    background: rgba(23,29,43,.6);
  }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--text-dim);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
    transition: all .18s ease;
  }
  .chip:hover { color: var(--text); border-color: #33405a; }
  .chip.active { color: #0b0e14; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chip.react.active { background: var(--money); border-color: var(--money); }
  .feed-head .count { margin-left: auto; color: var(--text-faint); font-family: var(--mono); font-size: 11px; }

  #feed { flex: 1; overflow-y: auto; padding: 8px; scroll-behavior: smooth; }
  #feed::-webkit-scrollbar { width: 8px; }
  #feed::-webkit-scrollbar-thumb { background: #263046; border-radius: 8px; }
  .row {
    display: grid; grid-template-columns: 64px 8px 1fr auto; gap: 10px; align-items: start;
    padding: 9px 10px; border-radius: 10px; margin-bottom: 4px;
    border: 1px solid transparent; background: rgba(255,255,255,.015);
    animation: slide .28s cubic-bezier(.2,.9,.25,1);
  }
  .row:hover { background: rgba(255,255,255,.035); border-color: var(--line-soft); }
  .row.hot { background: linear-gradient(90deg, rgba(245,197,66,.10), rgba(245,197,66,.02)); border-color: rgba(245,197,66,.25); }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .row .time { color: var(--text-faint); font: 11px/1.6 var(--mono); padding-top: 1px; }
  .row .stripe { width: 4px; border-radius: 3px; align-self: stretch; }
  .row .body { min-width: 0; }
  .row .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .row .kind { font: 11px/1 var(--mono); color: var(--text-dim); letter-spacing: .3px; }
  .row .who { font-weight: 600; font-size: 13px; }
  .row .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-dim); font-family: var(--mono);
  }
  .row .badge.guard { color: var(--money); border-color: rgba(245,197,66,.35); }
  .row .text {
    margin-top: 3px; color: #c9d2e4; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;
  }
  .row .money { color: var(--money); font-family: var(--mono); font-size: 12px; margin-left: 6px; }
  .row .right { display: flex; align-items: center; gap: 6px; }
  .react-tag {
    font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 999px;
    color: var(--money); background: rgba(245,197,66,.10); border: 1px solid rgba(245,197,66,.3);
  }
  .ack-btn {
    border: 1px solid var(--line); background: var(--bg-elev); color: var(--text-dim);
    border-radius: 8px; padding: 3px 8px; font-size: 11px; cursor: pointer;
    transition: all .16s ease;
  }
  .ack-btn:hover { color: var(--accent); border-color: var(--accent); }
  .ack-btn.done { color: var(--audience); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }

  aside { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; }
  .card {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: linear-gradient(160deg, var(--bg-elev2), var(--bg-elev));
    padding: 14px 16px; min-height: 0;
  }
  .card h3 {
    margin: 0 0 12px; font-size: 12px; letter-spacing: .8px; color: var(--text-dim);
    font-weight: 600; text-transform: uppercase;
  }
  .bars { display: flex; flex-direction: column; gap: 9px; overflow-y: auto; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 38px; gap: 8px; align-items: center; font-size: 12px; }
  .bar-row .name { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
  .bar { height: 6px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.2,.9,.25,1); }
  .bar-row .n { text-align: right; font-family: var(--mono); color: var(--text-faint); font-size: 11px; }
  .meta { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .meta .line { display: flex; justify-content: space-between; gap: 10px; }
  .meta .k { color: var(--text-faint); }
  .meta .v { font-family: var(--mono); color: var(--text); text-align: right; }
  .empty { color: var(--text-faint); text-align: center; padding: 40px 0; font-size: 13px; }
  @media (max-width: 1080px) {
    .shell { grid-template-columns: 1fr; height: auto; }
    aside { flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="logo"><span class="dot"></span>LAPLACE Relay <small>live event bus</small></div>
    <div class="spacer"></div>
    <span class="pill" id="conn"><span class="dot"></span><span id="conn-text">连接中</span></span>
    <span class="pill" id="rate">0 ev/min</span>
    <span class="pill" id="subs">0 订阅者</span>
    <span class="pill" id="clock">--:--:--</span>
  </header>

  <div class="main">
    <div class="kpis">
      <div class="kpi"><div class="label">本场事件</div><div class="value" id="k-total">0</div><div class="sub" id="k-total-sub">seq 0</div></div>
      <div class="kpi hot"><div class="label">互动收益 (¥)</div><div class="value" id="k-money">0</div><div class="sub" id="k-money-sub">gift · sc · 上舰</div></div>
      <div class="kpi"><div class="label">待主播互动</div><div class="value" id="k-react">0</div><div class="sub">weight ≥ 30</div></div>
      <div class="kpi"><div class="label">已回应</div><div class="value" id="k-acks">0</div><div class="sub" id="k-acks-sub">ack 回执</div></div>
    </div>

    <div class="feed-wrap">
      <div class="feed-head" id="filters">
        <button class="chip active" data-family="all">全部</button>
        <button class="chip" data-family="chat">弹幕</button>
        <button class="chip" data-family="money">礼物/收益</button>
        <button class="chip" data-family="audience">观众</button>
        <button class="chip" data-family="room">房间</button>
        <button class="chip" data-family="lifecycle">直播</button>
        <button class="chip" data-family="moderation">管理</button>
        <button class="chip react" data-family="reaction">只看需互动</button>
        <span class="count" id="feed-count">0 条</span>
      </div>
      <div id="feed"><div class="empty">等待事件…</div></div>
    </div>
  </div>

  <aside>
    <div class="card" style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <h3>事件分布</h3>
      <div class="bars" id="bars"><div class="empty">暂无数据</div></div>
    </div>
    <div class="card">
      <h3>会话</h3>
      <div class="meta" id="meta">
        <div class="line"><span class="k">房间</span><span class="v" id="m-room">-</span></div>
        <div class="line"><span class="k">来源</span><span class="v" id="m-source">-</span></div>
        <div class="line"><span class="k">环形缓冲</span><span class="v" id="m-ring">-</span></div>
        <div class="line"><span class="k">Webhook</span><span class="v" id="m-hooks">-</span></div>
        <div class="line"><span class="k">会话 ID</span><span class="v" id="m-sid" style="font-size:10px;">-</span></div>
      </div>
    </div>
  </aside>
</div>

<script>
(function () {
  var FAMILY_COLORS = {
    chat: 'var(--chat)', money: 'var(--money)', audience: 'var(--audience)',
    room: 'var(--room)', lifecycle: 'var(--lifecycle)', moderation: 'var(--moderation)',
    system: 'var(--system)', unknown: 'var(--text-faint)'
  };
  var feedEl = document.getElementById('feed');
  var connEl = document.getElementById('conn');
  var connText = document.getElementById('conn-text');
  var rows = 0;
  var filterFamily = 'all';
  var paused = false;
  var state = null;
  var ws = null;
  var retry = 0;
  var acked = {};
  var loaded = false;
  var pending = [];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function timeOf(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws/stream?min_weight=0');
    ws.onopen = function () {
      retry = 0;
      connEl.className = 'pill on';
      connText.textContent = '已连接';
    };
    ws.onclose = function () {
      connEl.className = 'pill off';
      connText.textContent = '已断开';
      retry += 1;
      setTimeout(connect, Math.min(8000, 500 * retry));
    };
    ws.onerror = function () {};
    ws.onmessage = function (evt) {
      var msg = JSON.parse(evt.data);
      if (msg.t === 'event') { if (!loaded) pending.push(msg.data); else onEvent(msg.data); }
    };
  }

  function accept(ev) {
    if (filterFamily === 'reaction') return ev.interaction.needs_reaction;
    if (filterFamily === 'all') return true;
    return ev.family === filterFamily;
  }

  function onEvent(ev) {
    if (accept(ev)) pushRow(ev);
    var total = document.getElementById('k-total');
    total.textContent = String(Number(total.textContent.replace(/[^0-9]/g, '')) + 1);
  }

  function pushRow(ev) {
    if (paused) return;
    var empty = feedEl.querySelector('.empty');
    if (empty) empty.remove();
    var row = document.createElement('div');
    row.className = 'row' + (ev.interaction.needs_reaction ? ' hot' : '');
    row.dataset.id = ev.id;

    var stripe = document.createElement('div');
    stripe.className = 'stripe';
    stripe.style.background = FAMILY_COLORS[ev.family] || FAMILY_COLORS.unknown;

    var time = document.createElement('div');
    time.className = 'time';
    time.textContent = timeOf(ev.ts);

    var body = document.createElement('div');
    body.className = 'body';
    var top = document.createElement('div');
    top.className = 'top';
    var kind = document.createElement('span');
    kind.className = 'kind';
    kind.textContent = ev.kind;
    top.appendChild(kind);
    if (ev.actor && ev.actor.name) {
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = ev.actor.name;
      top.appendChild(who);
    }
    if (ev.actor && ev.actor.guard_name) {
      var g = document.createElement('span');
      g.className = 'badge guard';
      g.textContent = ev.actor.guard_name;
      top.appendChild(g);
    }
    if (ev.actor && ev.actor.badge) {
      var b = document.createElement('span');
      b.className = 'badge';
      b.textContent = (ev.actor.badge.name || '') + ' ' + (ev.actor.badge.level || '');
      top.appendChild(b);
    }
    body.appendChild(top);

    var text = document.createElement('div');
    text.className = 'text';
    text.textContent = ev.text || '';
    if (ev.amount && ev.amount.cny) {
      var m = document.createElement('span');
      m.className = 'money';
      m.textContent = '¥' + ev.amount.cny;
      text.appendChild(m);
    }
    body.appendChild(text);

    var right = document.createElement('div');
    right.className = 'right';
    if (ev.interaction.needs_reaction) {
      var tag = document.createElement('span');
      tag.className = 'react-tag';
      tag.textContent = '需互动 ' + ev.interaction.weight;
      right.appendChild(tag);
      var btn = document.createElement('button');
      btn.className = 'ack-btn' + (acked[ev.id] ? ' done' : '');
      btn.textContent = acked[ev.id] ? '已回应' : '回应';
      btn.onclick = function () {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ t: 'ack', event_id: ev.id, action: 'manual_ack', note: 'acked from panel' }));
        acked[ev.id] = true;
        btn.className = 'ack-btn done';
        btn.textContent = '已回应';
      };
      right.appendChild(btn);
    }
    row.appendChild(time);
    row.appendChild(stripe);
    row.appendChild(body);
    row.appendChild(right);
    feedEl.appendChild(row);
    rows += 1;
    while (feedEl.children.length > 180) feedEl.removeChild(feedEl.firstChild);
    document.getElementById('feed-count').textContent = rows + ' 条';
    if (!paused) feedEl.scrollTop = feedEl.scrollHeight;
  }

  document.getElementById('filters').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    Array.prototype.forEach.call(this.querySelectorAll('.chip'), function (c) { c.classList.remove('active'); });
    btn.classList.add('active');
    filterFamily = btn.dataset.family;
    feedEl.innerHTML = '';
    rows = 0;
    document.getElementById('feed-count').textContent = '0 条';
    refreshAll();
  });

  feedEl.addEventListener('mouseenter', function () { paused = true; });
  feedEl.addEventListener('click', function (e) { if (e.target.closest('.ack-btn')) e.stopPropagation(); });
  feedEl.addEventListener('mouseleave', function () { paused = false; });

  function renderBars(byKind) {
    var el = document.getElementById('bars');
    var entries = Object.keys(byKind || {}).map(function (k) { return [k, byKind[k]]; });
    if (!entries.length) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    entries.sort(function (a, b) { return b[1] - a[1]; });
    var max = entries[0][1] || 1;
    el.innerHTML = '';
    entries.slice(0, 12).forEach(function (pair) {
      var row = document.createElement('div');
      row.className = 'bar-row';
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = pair[0];
      var bar = document.createElement('span');
      bar.className = 'bar';
      var fill = document.createElement('i');
      fill.style.width = Math.max(3, Math.round((pair[1] / max) * 100)) + '%';
      fill.style.background = 'linear-gradient(90deg, var(--accent), var(--accent-2))';
      bar.appendChild(fill);
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(pair[1]);
      row.appendChild(name); row.appendChild(bar); row.appendChild(n);
      el.appendChild(row);
    });
  }

  function refreshAll() {
    var qs = filterFamily !== 'all' && filterFamily !== 'reaction'
      ? '&family=' + filterFamily
      : filterFamily === 'reaction' ? '&reaction=1' : '';
    fetch('/api/events?limit=80' + qs)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        feedEl.innerHTML = '';
        rows = 0;
        data.events.forEach(pushRow);
        document.getElementById('feed-count').textContent = rows + ' 条';
        if (!loaded) {
          loaded = true;
          pending.splice(0, 80).forEach(function (ev) { if (accept(ev)) pushRow(ev); });
          feedEl.scrollTop = feedEl.scrollHeight;
        }
      })
      .catch(function () { if (!loaded) { loaded = true; } });
  }

  function poll() {
    fetch('/api/state').then(function (r) { return r.json(); }).then(function (s) {
      state = s;
      var total = s.session.total;
      document.getElementById('k-total').textContent = String(total);
      document.getElementById('k-total-sub').textContent = 'seq ' + s.session.seq;
      document.getElementById('k-money').textContent = (s.session.amount_cny || 0).toFixed(2);
      document.getElementById('k-react').textContent = String(s.session.pending_reactions || 0);
      document.getElementById('k-acks').textContent = String(s.session.reaction_count || 0);
      document.getElementById('k-acks-sub').textContent = s.acks.length ? ('最近 ' + timeOf(new Date(s.acks[s.acks.length - 1].acknowledged_at).getTime()) + ' ' + s.acks[s.acks.length - 1].action) : 'ack 回执';
      document.getElementById('rate').textContent = s.session.rate_per_min + ' ev/min';
      document.getElementById('subs').textContent = (s.subscribers.ws + s.subscribers.sse) + ' 订阅者';
      renderBars(s.session.by_kind);
      document.getElementById('m-room').textContent = (s.session.rooms && s.session.rooms.length) ? s.session.rooms.join(',') : (s.config.rooms || '-');
      document.getElementById('m-source').textContent = s.config.source;
      document.getElementById('m-ring').textContent = s.ring.size + ' / ' + s.ring.capacity;
      document.getElementById('m-hooks').textContent = s.hooks.configured ? (s.hooks.configured + ' 个') : '未配置';
      document.getElementById('m-sid').textContent = s.session.id.slice(0, 18);
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });

    }).catch(function () {});
  }

  connect();
  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
